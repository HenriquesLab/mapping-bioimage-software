  - generative adversarial
  - GAN-based
  - generative-adversarial-network-based
  - diffusion model
  - foundation model
  - encoder-decoder
  - ResNet
  - VGG
  - autoencoder
  - representation learning
  - pretrained model
  - pre-trained model
  - segmentation model
  - segmentation-model
  - denoising network
