# ---------------------------------------------------------------------------
# Deep-learning lexicon for the strict DL-within-package Europe PMC queries.
#
# Read by census/build/build_dataset_dl_in_tools.py, which ORs the terms into
# TITLE and ABSTRACT clauses beside each package's aliases. It is not the
# lexicon of the per-paper classifier, which reads config/dl_lexicon.yml.
#
# A package's paper is flagged deep-learning when the query matches any
# `include` term and no `exclude_guard` term (the guards catch phrases such as
# "without deep learning"). Matching is case-insensitive on word boundaries;
# multiword terms match as phrases.
#
# This list is versioned and printed verbatim in the Supplementary so the
# queries are fully auditable and reproducible.
# ---------------------------------------------------------------------------

version: 1

include:
  - deep learning
  - deep-learning
  - deep learning-based
  - deep neural network
  - deep neural-network
  - convolutional neural network
  - Convolutional Neural Network
  - Convolutional Neural Networks
  - Convolutional Neural Networks-Based
  - Convolutional Neuronal Network
  - Convolutional Neuronal networks
  - convolutional neural-network
  - convolutional network
  - neural network-assisted
  - Recurrent Neural Networks
  - Recurrent Neural Network
  - R-CNN
  - CNN-based
  - U-Net
  - UNet
  - transformer
  - vision transformer
  - vision-transformer
  - self-supervised
  - semantic segmentation
  - instance segmentation
  - generative adversarial
  - GAN-based
  - generative-adversarial-network-based
  - diffusion model
  - foundation model
  - encoder-decoder
  - ResNet
  - VGG
  - autoencoder
  - representation learning
  - pretrained model
  - pre-trained model
  - segmentation model
  - segmentation-model
  - denoising network
  - denoising-network
  - Noise2Noise
  - Noise2Void
  - content-aware restoration
  - attention mechanism

# If any of these appear, do not flag as DL even when an include term matches.
exclude_guard:
  - without deep learning
  - non-deep-learning
  - classical machine learning only
