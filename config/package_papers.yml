# Each package's own papers: the papers its developers ask users to cite.
# Used to count papers that cite a package through Europe PMC's resolved
# citation links (CITES:<id>_<source>), so plugin papers named after a host do
# not count. A paper absent from Europe PMC cannot be counted this way.
