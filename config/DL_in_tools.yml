# ---------------------------------------------------------------------------
# Deep-learning-within-package Europe PMC query registry.
#
# Entries combine package aliases and context with deep-learning terms from a lexicon.
# Package aliases are searched without a field scope; only the deep-learning terms
# are restricted to TITLE and ABSTRACT (census/build/build_dataset_dl_in_tools.py).
# The builder applies the Europe PMC RA/non-review filter in europepmc_RA.py.
# ---------------------------------------------------------------------------

settings:
  year_start: 2010
  year_end: 2025
  # Same clause as tools.yml, so the term query and the counts cover the same records.
  context_query: "(microscopy OR microscope) AND HAS_FT:Y"
  default_dl_lexicon: dl_in_tools_lexicon.yml

tools:
  - id: imagej
    name: ImageJ / Fiji
    aliases: ["ImageJ", "ImageJ2", "Fiji", "FIJI"]
    needs_context: true
    dl_lexicon: dl_in_tools_lexicon.yml

  - id: napari
    name: napari
    aliases: ["napari"]
    needs_context: true
    dl_lexicon: dl_in_tools_lexicon.yml

  - id: jupyter
    name: Jupyter notebooks
    aliases: ["Jupyter", "Jupyter notebook", "IPython notebook"]
    needs_context: true
    dl_lexicon: dl_in_tools_lexicon.yml
