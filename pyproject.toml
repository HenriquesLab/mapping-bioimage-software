# Project metadata and test configuration. The package runs in place from this
# directory (python -m census.<module>); it is not built or installed.
# release/make_release.py reads [project] version as its default version.
[project]
name = "mapping-bioimage-software"
version = "2026.10.31.1"
description = "Data and code for Mapping bioimage-analysis software adoption in microscopy."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Tayla Shakespeare" },
  { name = "Bruno M. Saraiva" },
  { name = "Inês Cunha" },
  { name = "Caron Jacobs" },
  { name = "Guillaume Jacquemet" },
  { name = "Ricardo Henriques", email = "r.henriques@itqb.unl.pt" },
]
urls = { Homepage = "https://github.com/HenriquesLab/mapping-bioimage-software", Issues = "https://github.com/HenriquesLab/mapping-bioimage-software/issues" }
keywords = [
  "bioimage analysis",
  "scientific software",
  "ImageJ",
  "QuPath",
  "deep learning",
  "bibliometrics",
  "research software sustainability",
]

# Test configuration only.
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
